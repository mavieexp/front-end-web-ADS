
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário para vaga de emprego</title>

    <link rel="stylesheet" href="./styles/global.css">
    <script src="./scripts/index.js" defer></script>
</head>

<body>

    <header>
        <h1>Candidate-se!</h1>
        <h2>Preencha seus dados para participar do nosso processo seletivo.</h2>
    </header>

    <main>
        <h2>Dados pessoais</h2>

        <form id="cadastro" novalidate onsubmit="executar(event)">

            <label for="nome">Nome completo*</label>
            <input type="text" id="nome">
            <p id="erro-nome" class="oculto"></p>

            <label for="idade">Idade*</label>
            <input type="number" id="idade">
            <p id="erro-idade" class="oculto"></p>

            <label for="email">E-mail*</label>
            <input type="email" id="email">
            <p id="erro-email" class="oculto"></p>

            <label for="telefone">Telefone*</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000">
            <p id="erro-telefone" class="oculto"></p>

            <label for="cpf">CPF*</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
            <p id="erro-cpf" class="oculto"></p>

            <label for="nascimento">Data de nascimento*</label>
            <input type="date" id="nascimento">
            <p id="erro-nascimento" class="oculto"></p>

            <label for="cidade">Cidade*</label>
            <input type="text" id="cidade">
            <p id="erro-cidade" class="oculto"></p>

            <label for="vaga">Vaga desejada*</label>
            <select id="vaga">
                <option value="">Selecione uma vaga</option>
                <option value="Atendente">Atendente</option>
                <option value="Auxiliar administrativo">Auxiliar administrativo</option>
                <option value="Desenvolvedor">Desenvolvedor</option>
                <option value="Estagiário">Estagiário</option>
            </select>
            <p id="erro-vaga" class="oculto"></p>

            <label for="experiencia">Possui experiência profissional?*</label>
            <select id="experiencia">
                <option value="">Selecione</option>
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>
            <p id="erro-experiencia" class="oculto"></p>

            <label for="escolaridade">Escolaridade*</label>
            <select id="escolaridade">
                <option value="">Selecione</option>
                <option value="Ensino fundamental">Ensino fundamental</option>
                <option value="Ensino médio">Ensino médio</option>
                <option value="Ensino superior">Ensino superior</option>
                <option value="Pós-graduação">Pós-graduação</option>
            </select>
            <p id="erro-escolaridade" class="oculto"></p>

            <label for="sobre">Fale um pouco sobre você*</label>
            <textarea id="sobre"></textarea>
            <p id="erro-sobre" class="oculto"></p>

            <label>
                <input type="checkbox" id="termos">
                Li e aceito os termos.
            </label>
            <p id="erro-termos" class="oculto"></p>

            <button type="submit">Enviar candidatura</button>

            <p id="concluido" class="oculto"></p>

        </form>
    </main>

    <footer>
        <p>Processo seletivo - Formulário de candidatura</p>
    </footer>

</body>
</html>
